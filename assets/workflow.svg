<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">One conversation. Two kinds of work.</title>
  <desc id="desc">Planned workflow: your request goes to Codex for planning, coding and verification. JevPilot assists with routing, filtering and failure triage. Codex delivers the result.</desc>
  <rect x="1" y="1" width="1278" height="298" rx="20" fill="#12161c" stroke="#343a43"/>
  <text x="40" y="43" fill="#8e9baa" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2">THE PLANNED WORKFLOW</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="40" y="102" width="220" height="102" rx="14" fill="#1d232c" stroke="#39424e"/>
    <text x="64" y="145" fill="#e9edf2" font-size="24" font-weight="700">Your request</text><text x="64" y="177" fill="#98a6b7" font-size="16">Just ask as usual.</text>
    <rect x="324" y="80" width="354" height="146" rx="14" fill="#edf1f5"/>
    <text x="350" y="122" fill="#19232f" font-size="26" font-weight="700">Codex</text><text x="350" y="154" fill="#526176" font-size="16">Plan. Build. Verify.</text><text x="350" y="200" fill="#526176" font-size="14">Owns the task from start to finish.</text>
    <rect x="764" y="80" width="476" height="146" rx="14" fill="#202b2d" stroke="#49605e"/>
    <text x="790" y="122" fill="#d3e5df" font-size="26" font-weight="700">JevPilot</text><text x="790" y="154" fill="#adbfbb" font-size="16">Route effort. Filter context. Triage failures.</text><text x="790" y="200" fill="#adbfbb" font-size="14">Small decisions, inside the same workflow.</text>
  </g>
  <g fill="none" stroke="#8d9cae" stroke-width="2"><path d="M271 153h40m-8-7 8 7-8 7M690 136h59m-8-7 8 7-8 7M749 173h-59m8-7-8 7 8 7"/></g>
  <text x="640" y="270" text-anchor="middle" fill="#8e9baa" font-family="Arial,Helvetica,sans-serif" font-size="14">No extra prompts to remember. No separate workflow to manage.</text>
</svg>
