<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">计划中的协作方式</title>
  <desc id="desc">计划中的协作：用户描述任务，Codex 计划、实现并验收，JevPilot 协助处理有边界的小判断。</desc>
  <rect x="1" y="1" width="1278" height="298" rx="20" fill="#12161c" stroke="#343a43" />
  <text x="40" y="43" fill="#8e9baa" font-family="Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12" letter-spacing="0">计划中的协作方式</text>
  <g font-family="Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif">
    <rect x="40" y="102" width="220" height="102" rx="14" fill="#1d232c" stroke="#39424e" />
    <text x="64" y="145" fill="#e9edf2" font-size="24" font-weight="700" letter-spacing="0">你的需求</text>
    <text x="64" y="177" fill="#98a6b7" font-size="16" letter-spacing="0">像平时一样提问。</text>
    <rect x="324" y="80" width="354" height="146" rx="14" fill="#edf1f5" />
    <text x="350" y="122" fill="#19232f" font-size="26" font-weight="700" letter-spacing="0">Codex</text>
    <text x="350" y="154" fill="#526176" font-size="16" letter-spacing="0">计划、实现、验收。</text>
    <text x="350" y="200" fill="#526176" font-size="14" letter-spacing="0">从开始到结束，负责整个任务。</text>
    <rect x="764" y="80" width="476" height="146" rx="14" fill="#202b2d" stroke="#49605e" />
    <text x="790" y="122" fill="#d3e5df" font-size="26" font-weight="700" letter-spacing="0">JevPilot</text>
    <text x="790" y="154" fill="#adbfbb" font-size="16" letter-spacing="0">判档、筛上下文、识别失败原因。</text>
    <text x="790" y="200" fill="#adbfbb" font-size="14" letter-spacing="0">在同一个工作流中，处理细小判断。</text>
  </g>
  <g fill="none" stroke="#8d9cae" stroke-width="2">
    <path d="M271 153h40m-8-7 8 7-8 7M690 136h59m-8-7 8 7-8 7M749 173h-59m8-7-8 7 8 7" />
  </g>
  <text x="640" y="270" text-anchor="middle" fill="#8e9baa" font-family="Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="14" letter-spacing="0">不用记专门的提示词，也不用切换工作方式。</text>
</svg>