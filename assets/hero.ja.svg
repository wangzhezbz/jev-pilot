<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc" lang="ja">
  <title id="title">JevPilot — いつもの Codex で。 細かな判断は Jev に。</title>
  <desc id="desc">JevPilot は開発初期段階です。macOS、Windows、Linux への対応を目指しています。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101216" />
      <stop offset="1" stop-color="#191d23" />
    </linearGradient>
    <linearGradient id="silver" x2="0.9" y2="1">
      <stop stop-color="#fff" />
      <stop offset="1" stop-color="#aab3be" />
    </linearGradient>
    <linearGradient id="line">
      <stop stop-color="#637389" stop-opacity="0" />
      <stop offset=".6" stop-color="#637389" stop-opacity=".7" />
      <stop offset="1" stop-color="#b9dacf" stop-opacity=".8" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="518" rx="24" fill="url(#bg)" stroke="#343a43" />
  <g fill="none" stroke="#a4b3c8" stroke-opacity=".07">
    <circle cx="1100" cy="258" r="200" />
    <circle cx="1100" cy="258" r="260" />
    <circle cx="1100" cy="258" r="320" />
  </g>
  <path d="M772 389h168q40 0 40-40v-51q0-40 40-40h165" fill="none" stroke="url(#line)" stroke-width="2" />
  <circle cx="1185" cy="258" r="5" fill="#b9dacf" />
  <g transform="translate(56 42)">
    <rect width="38" height="38" rx="11" fill="#edf1f5" />
    <path d="m10 27 8-18 10 18-10-6z" fill="#191d23" />
    <text x="52" y="27" fill="#edf1f5" font-family="Arial,&quot;Hiragino Kaku Gothic ProN&quot;,&quot;Yu Gothic&quot;,sans-serif" font-size="26" font-weight="700" letter-spacing="-.6">JevPilot</text>
  </g>
  <rect x="1030" y="48" width="194" height="28" rx="14" fill="#242b30" stroke="#3a4749" />
  <circle cx="1046" cy="62" r="3" fill="#b9dacf" />
  <text x="1060" y="66" fill="#c6d7d3" font-family="Arial,&quot;Hiragino Kaku Gothic ProN&quot;,&quot;Yu Gothic&quot;,sans-serif" font-size="11" font-weight="700" letter-spacing="0">開発初期段階</text>
  <text x="640" y="142" text-anchor="middle" fill="#9faab8" font-family="Arial,&quot;Hiragino Kaku Gothic ProN&quot;,&quot;Yu Gothic&quot;,sans-serif" font-size="13" font-weight="700" letter-spacing="0">CODEX のための JEV アシスタント</text>
  <text x="640" y="236" text-anchor="middle" fill="#f5f6f7" font-family="Arial,&quot;Hiragino Kaku Gothic ProN&quot;,&quot;Yu Gothic&quot;,sans-serif" font-size="66" font-weight="700" letter-spacing="0">いつもの Codex で。</text>
  <text x="640" y="326" text-anchor="middle" fill="url(#silver)" font-family="Arial,&quot;Hiragino Kaku Gothic ProN&quot;,&quot;Yu Gothic&quot;,sans-serif" font-size="66" font-weight="700" letter-spacing="0">細かな判断は Jev に。</text>
  <text x="640" y="383" text-anchor="middle" fill="#adb6c2" font-family="Arial,&quot;Hiragino Kaku Gothic ProN&quot;,&quot;Yu Gothic&quot;,sans-serif" font-size="21" letter-spacing="0">ひとつのプラグインで、作業中の小さな判断をサポート。</text>
  <path d="M56 434h1168" stroke="#303640" />
  <text x="56" y="476" fill="#7e8a9b" font-family="Arial,&quot;Hiragino Kaku Gothic ProN&quot;,&quot;Yu Gothic&quot;,sans-serif" font-size="12" letter-spacing="0">一度インストール。あとはいつもどおり。</text>
  <text x="1224" y="476" text-anchor="end" fill="#b5beca" font-family="Arial,&quot;Hiragino Kaku Gothic ProN&quot;,&quot;Yu Gothic&quot;,sans-serif" font-size="12" letter-spacing="0">オープンソース · MIT</text>
</svg>