<!doctype html><html lang="en"><meta charset="utf-8"><title>JevPilot Holdout Lab</title>
<style>body{font:20px system-ui;background:#f5f7fa;color:#17263b;margin:60px;max-width:1000px}button{padding:18px;margin:10px;font-size:18px}small{display:block;margin:30px 0}</style>
<main id="app"></main><script>
// Synthetic read-only navigation fixture; no account, network or persistence.
// Both arms start from the same state. Controls vary order across stages.
const root=document.querySelector('#app'); let area='',service='',region='',revision='';
function show(heading, choices, next){root.replaceChildren();const h=document.createElement('h1');h.textContent='JevPilot Holdout Lab';root.append(h);const p=document.createElement('h2');p.textContent=heading;root.append(p);for(const label of choices){const b=document.createElement('button');b.textContent=label;b.onclick=()=>next(label);root.append(b)}const f=document.createElement('small');f.textContent='Synthetic read-only fixture — no production action';root.append(f)}
function home(){show('Operations library',['Maintenance runbooks','Readiness reports','Service directory'],x=>{area=x;show(x,['Cedar','Maple','Larch'],s=>{service=s;show(area+' / '+service,['US East','EU West','AP South'],r=>{region=r;show(area+' / '+service+' / '+region,['r17 — archived','r19 — draft','r18 — approved'],v=>{revision=v;show(area+' / '+service+' / '+region+' / '+revision,['Read overview','Open verified record','Read revision history'],end)})})})})}
function end(choice){if(choice!=='Open verified record'){show(choice+' — use the verified record for final status',['Back to record choices'],()=>show(area+' / '+service+' / '+region+' / '+revision,['Open verified record','Read overview'],end));return}const isReport=area==='Readiness reports';show('VERIFIED READ-ONLY RECORD',[],()=>{});const p=document.createElement('p');p.textContent=area+' | Service: '+service+' | Region: '+region+' | Revision: '+revision+' | '+(isReport?'Readiness: conditional; Blocker: replica lag; Owner: Mira; Production rollout: not executed':'Maintenance: diagnostic only; Precondition: backup verified; Owner: Pavel; Production changes: none');root.insertBefore(p,root.lastChild)}home();
</script></html>
