name: Verify JevPilot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Get-Command rg -ErrorAction SilentlyContinue) {
              rg --version
              if ($LASTEXITCODE -eq 0) { exit 0 }
            }
            choco install ripgrep -y --no-progress
            if (Get-Command rg -ErrorAction SilentlyContinue) {
              rg --version
              if ($LASTEXITCODE -eq 0) { exit 0 }
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          throw 'ripgrep is unavailable after three installation attempts'
      - run: npm run check
      - run: npm test
      - run: node scripts/build.mjs
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: jev-pilot-${{ runner.os }}-${{ runner.arch }}
          path: jev-pilot-*.tgz
