name: Publish preview packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/package-release.mjs', '.github/workflows/release-preview.yml']
permissions:
  contents: write
concurrency:
  group: preview-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run check
      - run: node scripts/build.mjs --all
      - run: node --test --test-concurrency=2 tests/*.test.mjs
      - run: node scripts/package-release.mjs
      - name: Publish verified preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=preview-20260926
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "JevPilot Preview · 2026-09-26" --notes-file docs/RELEASE-NOTES.md dist/release-20260926/*.zip dist/release-20260926/SHA256SUMS.txt
